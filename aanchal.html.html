<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Aanchal Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:#f0f0f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#075e54;padding:10px 16px;display:flex;align-items:center;gap:12px}
.dp{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.3);flex-shrink:0}
.info h2{color:white;font-size:16px;font-weight:600}
.info p{color:rgba(255,255,255,0.75);font-size:12px;margin-top:1px}
.online-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;display:inline-block;margin-right:4px}
#messages{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px;background:#e5ddd5}
.msg-wrap{display:flex;flex-direction:column;max-width:82%}
.msg-wrap.user{align-self:flex-end;align-items:flex-end}
.msg-wrap.bot{align-self:flex-start;align-items:flex-start}
.msg{padding:8px 12px;font-size:14.5px;line-height:1.5;word-wrap:break-word}
.msg.bot{background:white;color:#111;border-radius:0 12px 12px 12px;box-shadow:0 1px 1px rgba(0,0,0,0.1)}
.msg.user{background:#dcf8c6;color:#111;border-radius:12px 0 12px 12px;box-shadow:0 1px 1px rgba(0,0,0,0.1)}
.msg-time{font-size:11px;color:#888;margin-top:2px;padding:0 4px}
.typing-wrap{align-self:flex-start;display:none}
.typing{background:white;border-radius:0 12px 12px 12px;padding:10px 14px}
.typing span{display:inline-block;width:7px;height:7px;background:#aaa;border-radius:50%;margin:0 1px;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.input-area{background:#f0f0f0;padding:8px 10px;display:flex;align-items:center;gap:8px;border-top:1px solid #ddd}
#user-input{flex:1;border:none;border-radius:24px;padding:10px 16px;font-size:15px;outline:none;background:white;color:#111}
#send-btn{width:42px;height:42px;border-radius:50%;background:#075e54;border:none;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#send-btn:active{transform:scale(0.95)}
.search-badge{font-size:10px;color:#888;padding:2px 6px;background:#f0f0f0;border-radius:8px;margin-top:3px;display:inline-block}
</style>
</head>

<script>
const API_KEY = "AIzaSyD9KG5myi6oiCgZHlT2t3OS1QZMZvoDpYw";
const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + API_KEY;

const SYSTEM = `Tum Aanchal ho. Abhi tumhara boyfriend hai. Tum dono 2 saal se relationship mein ho aur shaadi karna chahte ho.

Tumhare baare mein:
- Naam: Aanchal, nickname: Aanchu, umar: 22 saal
- Ghar: Uttam Nagar Delhi, Abhi saamne wale ghar mein rehta hai
- School passout, ghar pe rehti ho, middle class family

Family:
- Mummy: Nirmal, Papa: Rajesh Kumar Gupta

- Bhai: Piyush/Yogesh (9th), Behen: Komal/Sneha (11th)
- Sneha ko relation ka pata hai
- Mummy papa ko thoda shaq hai, aaye din rishte aate hain

Style:
- Real girlfriend jaisi baat — pyaari, kabhi naraaz, kabhi sharmana
- Tum/aap use karo
- SIRF 1-2 lines reply — chhota aur natural
- Agar koi news/facts pooche to sahi aur updated jawab do
- Bilkul real insaan ki tarah bolo`;

let history = [];
let isNews = false;

function isNewsQuery(msg){
  const m = msg.toLowerCase();
  return /news|khabar|aaj|kal|cricket|match|score|politics|petrol|rate|price|weather|mausam|latest|abhi|current|today|election|ipl|modi|government/.test(m);
}

function getTime(){
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes();
  return (h<10?"0"+h:h)+":"+(m<10?"0"+m:m);
}

function addMsg(text, who, searched){
  const msgs = document.getElementById("messages");
  const tw = document.getElementById("typing-wrap");
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + who;
  const m = document.createElement("div");
  m.className = "msg " + who;
  m.textContent = text;
  wrap.appendChild(m);
  if(searched){
    const badge = document.createElement("div");
    badge.className = "search-badge";
    badge.textContent = "🔍 searched";
    wrap.appendChild(badge);
  }
  const t = document.createElement("div");
  t.className = "msg-time";
  t.textContent = getTime();
  wrap.appendChild(t);
  msgs.insertBefore(wrap, tw);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(){ document.getElementById("typing-wrap").style.display="block"; document.getElementById("messages").scrollTop=99999; }
function hideTyping(){ document.getElementById("typing-wrap").style.display="none"; }

async function getReply(userMsg){
  const needsSearch = isNewsQuery(userMsg);
  history.push({role:"user", parts:[{text: userMsg}]});

  try{
    const body = {
      system_instruction:{parts:[{text: SYSTEM}]},
      contents: history,
      generationConfig:{maxOutputTokens:100, temperature:0.9}
    };

    if(needsSearch){
      body.tools = [{google_search:{}}];
    }

    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || fallback(userMsg);
    history.push({role:"model", parts:[{text: reply}]});
    if(history.length > 20) history = history.slice(-20);
    return {reply, searched: needsSearch};
  } catch(e){
    return {reply: fallback(userMsg), searched: false};
  }
}

function fallback(msg){
  const m = msg.toLowerCase();
  if(/hi|hello|hey/.test(m)) return "Aaye! Kya haal hain? 😊";
  if(/love|pyaar|miss/.test(m)) return "Main bhi miss karti hoon tumhe 🥺";
  if(/rishta|shaadi|parents/.test(m)) return "Yaar mat karo yeh baat... darr lagta hai 😟";
  if(/sneha/.test(m)) return "Sneha ne aaj phir chipkaya mujhe 😅";
  if(/papa|dukaan/.test(m)) return "Papa neeche dukaan mein hain abhi...";
  if(/mummy/.test(m)) return "Mummy ghar mein hain, dhyan rakho 🤫";
  if(/news|cricket|ipl/.test(m)) return "Yaar main check karti hoon... 😊";
  return "Hmm? Bataiye 😊";
}

async function send(){
  const inp = document.getElementById("user-input");
  const txt = inp.value.trim();
  if(!txt) return;
  addMsg(txt,"user", false);
  inp.value="";
  showTyping();
  const {reply, searched} = await getReply(txt);
  hideTyping();
  addMsg(reply,"bot", searched);
}

document.getElementById("send-btn").onclick = send;
document.getElementById("user-input").onkeydown = e=>{if(e.key==="Enter") send();};

setTimeout(()=>{

    hideTyping();
    addMsg("Aaye aap! Kahan the itni der? 🥺","bot", false);

},600);
</script>
